version: 2
ethernets:
%{ if interface_match != "" }
  ${interface_name}:
    match:
      name: "${interface_match}"
    set-name: "${interface_name}"
%{ else }
  ${interface_name}:
%{ endif }
%{ if static_ip != "" }
    dhcp4: false
    addresses: ["${static_ip}"]
    gateway4: "${gateway}"
    nameservers:
      addresses: ${nameservers}
%{ else }
    dhcp4: true
%{ endif }
