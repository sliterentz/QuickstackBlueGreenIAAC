#cloud-config
# Konfigurasi Cloud-Init Optimal & Production-Ready untuk Kubernetes

hostname: ${hostname}
fqdn: ${hostname}.localdomain
manage_etc_hosts: true

# 1. Update & Upgrade
package_update: true
package_upgrade: false

# 2. Essential Packages
packages:
  - qemu-guest-agent
  - net-tools
  - curl
  - wget
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - socat
  - conntrack
  - ipset
  - nfs-common
  - open-iscsi
  - jq
  - arp-scan

# 3. Create Files (Hardening & Config)
write_files:
  # Kernel Modules for K8s
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  # Sysctl for K8s
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      vm.overcommit_memory                = 1
      vm.panic_on_oom                     = 0
      kernel.panic                        = 10
      kernel.panic_on_oops                = 1
      kernel.keys.root_maxkeys            = 1000000
      kernel.keys.root_maxbytes           = 25000000

  # Containerd Config
  - path: /etc/containerd/config.toml
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true

  # Basic CIS Hardening: Secure SSH
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      UseDNS no
      ClientAliveInterval 30
      ClientAliveCountMax 4
      MaxAuthTries 3
      LogLevel VERBOSE
      AllowUsers ${ssh_user}
      X11Forwarding no
      AllowTcpForwarding yes

# 4. User Configuration
users:
  - name: ${ssh_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, sudo
    home: /home/${ssh_user}
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_key}
    lock_passwd: false

# 5. Provisioning Script
runcmd:
  # Ensure QEMU Guest Agent is running immediately
  - systemctl enable --now qemu-guest-agent
  - systemctl restart qemu-guest-agent

  # Disable Swap (Requirement for K8s)
  - swapoff -a
  - sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

  # Apply Kernel Modules & Sysctl
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # Restart SSHD to apply hardening
  - systemctl restart sshd

  # Install K3s (Lightweight Kubernetes)
  - |
    echo "Installing K3s with role: ${k3s_role}"
    if [ "${k3s_role}" = "agent" ]; then
       export K3S_URL="${k3s_server_url}"
       export K3S_TOKEN="${k3s_token}"
       echo "Joining cluster at $K3S_URL..."
       curl -sfL https://get.k3s.io | sh -s - --node-name ${hostname} --node-ip ${node_ip}
    else
       echo "Initializing cluster master..."
       # Server installation with explicit node-ip and tls-san
       curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --tls-san ${hostname} --tls-san ${node_ip} --node-name ${hostname} --node-ip ${node_ip}" sh -
    fi

  # Setup Firewall (UFW)
  - ufw allow 22/tcp
  - ufw allow 6443/tcp # K3s API Server
  - ufw allow 10250/tcp # Kubelet API
  - ufw allow 8472/udp # Flannel VXLAN
  - ufw allow 30000:32767/tcp # NodePort Services
  - ufw --force enable

  # Basic Monitoring: Install Prometheus Node Exporter
  - wget -q https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
  - tar xf node_exporter-1.8.2.linux-amd64.tar.gz
  - mv node_exporter-1.8.2.linux-amd64/node_exporter /usr/local/bin/
  - useradd -rs /bin/false node_exporter || true
  - |
    cat <<EOF > /etc/systemd/system/node_exporter.service
    [Unit]
    Description=Node Exporter
    After=network.target

    [Service]
    User=node_exporter
    Group=node_exporter
    Type=simple
    ExecStart=/usr/local/bin/node_exporter

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl daemon-reload
  - systemctl enable --now node_exporter
  - ufw allow 9100/tcp # Node Exporter port

  # Cleanup & Status Signal
  - echo "DONE" > /var/lib/cloud/instance/boot-finished-k3s
  - echo "Production-Ready Ubuntu for K3s with CIS Hardening & Monitoring is ready." > /tmp/provisioning-status.txt
  - date >> /tmp/provisioning-status.txt
