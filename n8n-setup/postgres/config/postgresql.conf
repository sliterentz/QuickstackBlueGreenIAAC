# -----------------------------
# PostgreSQL Configuration File
# -----------------------------

listen_addresses = '*'
max_connections = 200                   # Ditingkatkan untuk n8n worker + webhook + main
shared_buffers = 1GB                    # Asumsi RAM VM 4GB+ (set 25% dari total RAM)
effective_cache_size = 3GB              # Asumsi 75% dari total RAM
maintenance_work_mem = 256MB            # Mempercepat maintenance tasks
checkpoint_completion_target = 0.9      # Menyebar I/O checkpoint
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1                  # Asumsi SSD (jika HDD set 4.0)
effective_io_concurrency = 200          # Untuk SSD
work_mem = 4MB                          # Per connection memory
min_wal_size = 1GB
max_wal_size = 4GB
max_worker_processes = 4                # Sesuaikan dengan jumlah vCPU
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Logging & Monitoring
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'none'                  # Jangan log semua query (berisik)
log_min_duration_statement = 1000       # Log query yang > 1 detik
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
