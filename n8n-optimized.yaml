# n8n Enterprise Architecture (Optimized)
# Uses external Postgres (kube-system-green) and Redis (kube-system-blue)

# 1. Secrets Management (Mirrored from external or provided via vars)
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: ${namespace}
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: "${n8n_encryption_key}"
  DB_POSTGRESDB_PASSWORD: "${db_password}"
  DB_POSTGRESDB_USER: "${db_user}"
  DB_POSTGRESDB_DATABASE: "${db_name}"
  # Redis password for external redis
  REDIS_PASSWORD: "${redis_password}"

---
# 2. Persistent Volume Claims (Only for n8n data)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-storage
  namespace: ${namespace}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${storage_size}

---
# 3. Traefik Middleware for Path Stripping
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-strip-prefix
  namespace: ${namespace}
spec:
  stripPrefix:
    prefixes:
      - /n8n

---
# 4. n8n Main Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-main
  namespace: ${namespace}
  labels:
    app: n8n
    component: main
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: n8n
      component: main
  template:
    metadata:
      labels:
        app: n8n
        component: main
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - n8n
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - n8n-worker-1
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.n8n"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres.kube-system-green.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis.kube-system-green.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done"
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:${n8n_image_tag}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: "${n8n_hostname}"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: N8N_PROTOCOL
              value: "http"
            - name: N8N_PATH
              value: "/n8n/"
            - name: N8N_EDITOR_BASE_URL
              value: "http://${n8n_hostname}/n8n/"
            - name: WEBHOOK_URL
              value: "http://${n8n_hostname}/n8n/"
            - name: GENERIC_TIMEZONE
              value: "${timezone}"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              value: "redis.kube-system-green.svc.cluster.local"
            - name: QUEUE_BULL_REDIS_PORT
              value: "6379"
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: REDIS_PASSWORD
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "postgres.kube-system-green.svc.cluster.local"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_POSTGRESDB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
          resources:
            requests:
              memory: "${main_requests_memory}"
              cpu: "${main_requests_cpu}"
            limits:
              memory: "${main_limits_memory}"
              cpu: "${main_limits_cpu}"
          startupProbe:
            tcpSocket:
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 6
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-storage

---
# 5. n8n Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
  namespace: ${namespace}
  labels:
    app: n8n
    component: worker
spec:
  replicas: ${replicas}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: n8n
      component: worker
  template:
    metadata:
      labels:
        app: n8n
        component: worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - n8n
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - n8n-worker-1
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.n8n"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres.kube-system-green.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis.kube-system-green.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done"
        - name: wait-for-n8n-main
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z n8n-service 80; do sleep 2; done"
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:${n8n_image_tag}
          imagePullPolicy: IfNotPresent
          command: ["n8n", "worker"]
          env:
            - name: GENERIC_TIMEZONE
              value: "${timezone}"
            - name: N8N_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_SKIP_DB_MIGRATIONS
              value: "true"
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              value: "redis.kube-system-green.svc.cluster.local"
            - name: QUEUE_BULL_REDIS_PORT
              value: "6379"
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: REDIS_PASSWORD
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "postgres.kube-system-green.svc.cluster.local"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_POSTGRESDB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
          resources:
            requests:
              memory: "${worker_requests_memory}"
              cpu: "${worker_requests_cpu}"
            limits:
              memory: "${worker_limits_memory}"
              cpu: "${worker_limits_cpu}"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          emptyDir: {}

---
# 5b. Horizontal Pod Autoscaler for Worker
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n8n-worker-hpa
  namespace: ${namespace}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n-worker
  minReplicas: ${hpa_min_replicas}
  maxReplicas: ${hpa_max_replicas}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# 6. n8n Webhook Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook
  namespace: ${namespace}
  labels:
