            - "until nc -z n8n-service 80; do sleep 2; done"
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:${n8n_image_tag}
          imagePullPolicy: IfNotPresent
          command: ["n8n", "webhook"]
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: WEBHOOK_URL
              value: "http://${n8n_hostname}/n8n/"
            - name: GENERIC_TIMEZONE
