---
# 7. Main Service (Routing)
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: ${namespace}
spec:
  selector:
    app: n8n
    component: main
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
  type: ClusterIP

---
# 8. Webhook Service
apiVersion: v1
kind: Service
metadata:
  name: n8n-webhook-service
  namespace: ${namespace}
spec:
  selector:
    app: n8n
    component: webhook
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
  type: ClusterIP

---
# 9. Ingress (Traefik with Path Prefix)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: ${namespace}
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ${namespace}-n8n-strip-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  rules:
    - host: ${n8n_hostname}
      http:
        paths:
          - path: /n8n/webhook
            pathType: Prefix
            backend:
              service:
                name: n8n-webhook-service
                port:
                  number: 80
          - path: /n8n
            pathType: Prefix
            backend:
              service:
                name: n8n-service
                port:
                  number: 80
